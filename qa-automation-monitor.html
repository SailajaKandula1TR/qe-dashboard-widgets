                    const mode = launchName.includes('legacy') ? 'legacy' : (launchName.includes('modern') ? 'modern' : null);
                    if (!mode) continue;

                    try {
                        let page = 1;
                        let totalPages = 1;

                        do {
                            // hasChildren=false → only leaf executions (the actual test steps),
                            // not SUITE/TEST rollups, so each test is counted exactly once.
                            const path = `item?filter.eq.launchId=${launch.id}&filter.eq.hasStats=true&filter.eq.hasChildren=false&page.size=300&page.page=${page}`;
                            const result = await rpFetch(path, token);
                            const items = result?.content || [];
                            totalPages = result?.page?.totalPages || 1;

                            items.forEach(item => {
                                launchItemsScanned++;
                                const itemIds = parseItemIds(item);
                                if (!itemIds.length) return;
                                launchIdsExtracted++;

                                const matchedModules = new Set();
                                itemIds.forEach(id => {
                                    const mods = idToModules.get(String(id));
                                    if (mods) mods.forEach(m => matchedModules.add(m));
                                });
                                if (!matchedModules.size) {
                                    itemIds.forEach(id => launchUnmatchedIds.add(id));
                                    return;
                                }
                                launchModuleMatches++;

                                const bucket = statusBucket(item.status);
                                matchedModules.forEach(moduleName => {
                                    if (!moduleStats[mode][moduleName]) {
                                        moduleStats[mode][moduleName] = {
                                            func: moduleName,
                                            total: 0,
                                            passed: 0,
                                            failed: 0,
                                            skipped: 0,
                                            other: 0,
                                            launches: new Set()
                                        };
                                    }

                                    const stat = moduleStats[mode][moduleName];
                                    stat.total++;
                                    stat[bucket]++;
                                    stat.launches.add(launch.id);
                                });
                            });

                            page++;
                        } while (page <= totalPages);
                        if (log) {
                            log(`  Launch ${mode} "${launch.name}": ${launchItemsScanned} executions, ${launchIdsExtracted} with ADO IDs, ${launchModuleMatches} matched to a function`);
                            if (launchModuleMatches === 0 && launchUnmatchedIds.size > 0) {
                                log(`    ⚠ 0 matched. Sample extracted IDs not in ADO coverage: ${[...launchUnmatchedIds].slice(0, 10).join(', ')}`);
                            }
                        }
                    } catch (e) {
                        if (log) log(`  RP item scan failed for launch ${launch.id}: ${e.message}`);
                    }
                }

                const legacyCount = Object.keys(moduleStats.legacy).length;
                const modernCount = Object.keys(moduleStats.modern).length;
                if (log) log(`✓ RP ID matching complete: legacy=${legacyCount} modules, modern=${modernCount} modules`);

                if (legacyCount === 0 && modernCount === 0 && log) {
                    log(`⚠️ WARNING: Zero module matches. Check if RP test items contain ADO IDs (5-8 digits) in their payload.`);
                }

                const toRows = (mode) => Object.values(moduleStats[mode])
                    .map(s => ({
                        func: s.func,
                        total: s.total,
                        passed: s.passed,
                        failed: s.failed,
                        skipped: s.skipped,
                        launches: s.launches.size,
                        passRate: s.total > 0 ? Math.round((s.passed / s.total) * 100) : 0
                    }))
                    .sort((a, b) => b.total - a.total);

                return {
                    legacyByFunction: toRows('legacy'),
                    modernByFunction: toRows('modern')
                };
            }

            // ── Open Bugs by Function ─────────────────────────────────────────
            function buildOpenBugsByFunction(openBugFiles, ghData) {
                const byFunc = {};
                openBugFiles.forEach(entry => {
                    // Derive function from folder path
                    const parts = entry.folder.split('/');
                    const func = parts.find(p => !['e2e', 'tests', 'test', 'specs', 'spec', ''].includes(p.toLowerCase())) || 'Unknown';
                    if (!byFunc[func]) byFunc[func] = [];
                    byFunc[func].push(entry);
                });
                return byFunc;
            }

                let x = M;
                doc.setFillColor(241, 245, 249);
                doc.rect(M, y - 10, colW.reduce((a, b) => a + b, 0), 14, 'F');
                doc.setFont(undefined, 'bold');
                headers.forEach((h, i) => { doc.text(h, x + 2, y); x += colW[i]; });
                y += 14; doc.setFont(undefined, 'normal');

                (data.functionData || []).slice(0, 20).forEach(fn => {
                    x = M;
                    const autoP = fn.total > 0 ? Math.round((fn.automated / fn.total) * 100) : 0;
                    const row = [fn.name, fn.total, fn.automated, fn.regression, fn.automatedRegression, fn.rvt, fn.automatedRvt, fn.smoke, fn.automatedSmoke, autoP + '%', autoP + '%'];
                    row.forEach((v, i) => { doc.text(String(v), x + 2, y); x += colW[i]; });
                    y += 12;
                    if (y > 560) { doc.addPage(); y = M; }
                });

                doc.save('qa-automation-monitor.pdf');
            };

            // ── Render ────────────────────────────────────────────────────────
            const improvement = getImprovement();
            const functionMetricCaseMap = {
                total: 'totalCases',
                automated: 'automatedCases',
                regression: 'regressionCases',
                automatedRegression: 'automatedRegressionCases',
                rvt: 'rvtCases',
                automatedRvt: 'automatedRvtCases',
                smoke: 'smokeCases',
                automatedSmoke: 'automatedSmokeCases'
            };

            const openFunctionCaseModal = (fn, metricKey, metricLabel) => {
                const caseList = getFunctionCaseList(fn, metricKey);
                if (!caseList.length) {
                    alert('Detailed test case list is not available in current snapshot. Run Automation Coverage or Run All to refresh.');
                    return;
                }
                setShowModal({
                    type: 'function_case_list',
                    title: `${fn.name} - ${metricLabel} Test Cases`,
                    data: caseList
                });
            };

            const getFunctionCaseList = (fn, metricKey) => {
                const listKey = functionMetricCaseMap[metricKey];
                const storedList = listKey ? (fn?.[listKey] || []) : [];
                if (storedList.length) return storedList;

                const allCases = (data?.allTestCases || []).filter(tc => (tc.function || 'Unassigned') === fn?.name);
                if (!allCases.length) return [];

                const automatedIds = new Set((data?.automatedItems || []).map(item => item.id));
                const isAutomated = (tc) => automatedIds.has(tc.id);
                const isRegression = (tc) => (tc.suiteType || '').toLowerCase().includes('regression');
                const isRvt = (tc) => {
                    const suite = (tc.suiteType || '').toLowerCase();
                    return suite.includes('release validation') || suite.includes('rvt');
                };
                const isSmoke = (tc) => (tc.suiteType || '').toLowerCase().includes('smoke');

                switch (metricKey) {
                    case 'total': return allCases;
                    case 'automated': return allCases.filter(tc => isAutomated(tc));
                    case 'regression': return allCases.filter(tc => isRegression(tc));
                    case 'automatedRegression': return allCases.filter(tc => isRegression(tc) && isAutomated(tc));
                    case 'rvt': return allCases.filter(tc => isRvt(tc));
                    case 'automatedRvt': return allCases.filter(tc => isRvt(tc) && isAutomated(tc));
                    case 'smoke': return allCases.filter(tc => isSmoke(tc));
                    case 'automatedSmoke': return allCases.filter(tc => isSmoke(tc) && isAutomated(tc));
                    default: return [];
                }
            };

            const hasFunctionCaseList = (fn, metricKey) => {
                const directCount = Number(fn?.[metricKey] || 0);
                if (directCount > 0) return true;
                return getFunctionCaseList(fn, metricKey).length > 0;
            };

            return (
                <div className="min-h-screen pb-10">
                    {/* Header */}
                    <div className="sticky top-0 z-50 bg-white border-b border-slate-200 shadow-sm">
                        <div className="max-w-7xl mx-auto px-6 py-3 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-8 h-8 bg-indigo-100 rounded-lg flex items-center justify-center">
                                    <span className="text-indigo-600 text-lg">⚡</span>
                                </div>
                                <h1 className="text-lg font-bold text-slate-800">QA Automation Monitor</h1>
                                {data && <span className="text-xs text-slate-400 ml-2">Last: {new Date(data.timestamp).toLocaleString()}</span>}
                            </div>
                            <div className="flex items-center gap-2">
                                {/* Token Inputs */}
                                <input type="password" placeholder="ADO Token" value={adoToken} onChange={e => setAdoToken(e.target.value)}
                                    className="token-input w-28 text-xs" title="Azure DevOps PAT" />
                                <input type="password" placeholder="GitHub Token" value={ghToken} onChange={e => setGhToken(e.target.value)}
                                    className="token-input w-28 text-xs" title="GitHub PAT" />
                                <input type="password" placeholder="RP Token" value={rpToken} onChange={e => setRpToken(e.target.value)}
                                    className="token-input w-28 text-xs" title="Report Portal Token" />
                                <input type="text" placeholder="RP Project" value={rpProject} onChange={e => setRpProject(e.target.value)}
                                    className="token-input w-20 text-xs" title="Report Portal Project" />

                                <button className="btn btn-primary" onClick={generate} disabled={generating}>
                                    {generating ? '⏳ Running...' : '▶ Run All'}
                                </button>
                                <div style={{ position: 'relative', display: 'inline-block' }}>
                                    <button className="btn btn-outline" disabled={generating} onClick={() => document.getElementById('section-menu').classList.toggle('hidden')}>
                                        ▸ Run Section
                                    </button>
                                    <div id="section-menu" className="hidden" style={{ position: 'absolute', top: '100%', right: 0, zIndex: 100, marginTop: 4, background: 'white', border: '1px solid var(--border)', borderRadius: 8, boxShadow: '0 4px 12px rgba(0,0,0,0.1)', minWidth: 220 }}>
                                        <div style={{ padding: '6px 12px', fontSize: '10px', color: '#94a3b8', fontWeight: 600, textTransform: 'uppercase', borderBottom: '1px solid #f1f5f9' }}>Overall</div>
                                        <button className="btn" style={{ display: 'block', width: '100%', textAlign: 'left', borderRadius: 0 }} onClick={() => { document.getElementById('section-menu').classList.add('hidden'); runSection('counts'); }} disabled={generating}>
                                            🔢 Overall Counts (ADO + GitHub)
                                        </button>
                                        <div style={{ padding: '6px 12px', fontSize: '10px', color: '#94a3b8', fontWeight: 600, textTransform: 'uppercase', borderBottom: '1px solid #f1f5f9', borderTop: '1px solid #f1f5f9' }}>Overview & Stability</div>
                                        <button className="btn" style={{ display: 'block', width: '100%', textAlign: 'left', borderRadius: 0 }} onClick={() => { document.getElementById('section-menu').classList.add('hidden'); runSection('coverage'); }} disabled={generating}>
                                            📊 Automation Coverage
                                        </button>
                                        <button className="btn" style={{ display: 'block', width: '100%', textAlign: 'left', borderRadius: 0 }} onClick={() => { document.getElementById('section-menu').classList.add('hidden'); runSection('stability'); }} disabled={generating}>
                                            📈 Regression Stability
                                        </button>
                                        <button className="btn" style={{ display: 'block', width: '100%', textAlign: 'left', borderRadius: 0 }} onClick={() => { document.getElementById('section-menu').classList.add('hidden'); runSection('timeline'); }} disabled={generating}>
                                            📅 Automation Timeline
                                        </button>
                                        <div style={{ padding: '6px 12px', fontSize: '10px', color: '#94a3b8', fontWeight: 600, textTransform: 'uppercase', borderBottom: '1px solid #f1f5f9', borderTop: '1px solid #f1f5f9' }}>Bugs & Defects</div>
                                        <button className="btn" style={{ display: 'block', width: '100%', textAlign: 'left', borderRadius: 0 }} onClick={() => { document.getElementById('section-menu').classList.add('hidden'); runSection('rpbugs'); }} disabled={generating}>
                                            🪲 Bugs Found by Automation
                                        </button>
                                        <button className="btn" style={{ display: 'block', width: '100%', textAlign: 'left', borderRadius: 0 }} onClick={() => { document.getElementById('section-menu').classList.add('hidden'); runSection('openbugs'); }} disabled={generating}>
                                            🐛 Open Bugs by Function
                                        </button>
                                    </div>
                                </div>
                                {generating && <button className="btn btn-danger" onClick={stopGeneration}>⏹ Stop</button>}
                                <button className="btn btn-success" onClick={() => saveToSupabase(data, history)} disabled={!data || !sbConnected}>
                                    💾 Save
                                </button>
                                <button className="btn btn-outline" onClick={exportPDF} disabled={!data}>📄 PDF</button>
                                <button className="btn btn-outline" onClick={() => setShowConfig(true)}>⚙️</button>

                                {/* Sync indicator */}
                                {sbConnected && (
                                    <span className={`text-xs font-medium ${syncStatus === 'saved' ? 'text-green-600' : syncStatus === 'saving' ? 'text-amber-500' : syncStatus === 'error' ? 'text-red-500' : 'text-slate-400'}`}>
                                        {syncStatus === 'saved' ? '● Synced' : syncStatus === 'saving' ? '○ Saving...' : syncStatus === 'error' ? '● Error' : '○ Idle'}
                                    </span>
                                )}
                            </div>
                        </div>
                    </div>

                    <div className="max-w-7xl mx-auto px-6 mt-6">
                        {/* Generation Logs */}
                        {logs.length > 0 && (
                            <div className="card p-4 mb-6">
                                <div className="text-xs font-semibold text-slate-500 uppercase mb-2">Generation Log</div>
                                <div className="max-h-40 overflow-y-auto space-y-1">
                                    {logs.map((l, i) => (
                                        <div key={i} className={`log-entry ${l.active ? 'active' : ''}`}>
                                            <span className="text-slate-400 mr-2">{l.time}</span>{l.msg}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Main Metrics - Always visible */}
                        <div className="flex items-center gap-1 mb-6 border-b border-slate-200">
                            <button
                                className={`px-4 py-2 text-sm font-medium border-b-2 transition-colors ${activeTab === 'overview' ? 'border-indigo-500 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-700'}`}
                                onClick={() => setActiveTab('overview')}
                            >📊 Overview &amp; Stability</button>
                            <button
                                className={`px-4 py-2 text-sm font-medium border-b-2 transition-colors ${activeTab === 'bugs' ? 'border-indigo-500 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-700'}`}
                                onClick={() => setActiveTab('bugs')}
                            >🪲 Bugs &amp; Defects</button>
                        </div>

                        {activeTab === 'overview' && (<React.Fragment>
                        <div className="grid grid-cols-6 gap-4 mb-6">
                            <MetricCard
                                value={data ? data.totalAutomated : '—'}
                                label="Total Automated"
                                color="var(--accent)"
                                bgColor="var(--accent-light)"
                            />
                            <MetricCard
                                value={data ? data.mismatches.length : '—'}
                                label="Mismatches"
                                color="var(--amber)"
                                bgColor="var(--amber-light)"
                                onClick={data ? () => setShowModal({ type: 'mismatches', data: data.mismatches }) : undefined}
                                linkText="Show"
                            />
                            <MetricCard
                                value={data ? data.requiresUpdate.reduce((sum, e) => sum + (e.ids?.length || 0), 0) : '—'}
                                label="requires_update"
                                color="var(--purple)"
                                bgColor="var(--purple-light)"
                                onClick={data ? () => setShowModal({ type: 'requires_update', data: data.requiresUpdate }) : undefined}
                                linkText="Show"
                            />
                            <MetricCard
                                value={data ? data.openBugs.reduce((sum, e) => sum + (e.ids?.length || 0), 0) : '—'}
                                label="bug ids"
                                color="var(--red)"
                                bgColor="var(--red-light)"
                                onClick={data ? () => setShowModal({ type: 'open_bugs', data: data.openBugs }) : undefined}
                                linkText="Show"
                            />
                            <MetricCard
                                value={data ? data.runSequential.reduce((sum, e) => sum + (e.ids?.length || 0), 0) : '—'}
                                label="runSequential"
                                color="var(--teal)"
                                bgColor="var(--teal-light)"
                                onClick={data ? () => setShowModal({ type: 'runSequential', data: data.runSequential }) : undefined}
                                linkText="Show"
                            />
                            <MetricCard
                                value={data?.rpBugsFromAutomation ? data.rpBugsFromAutomation.length : '—'}
                                label="Bugs by Automation"
                                color="var(--red)"
                                bgColor="var(--red-light)"
                                onClick={data?.rpBugsFromAutomation?.length ? () => setShowModal({ type: 'bugs_by_automation', data: data.rpBugsFromAutomation }) : undefined}
                                linkText={data?.rpBugsFromAutomation?.length ? "Show" : undefined}
                            />
                        </div>

                        {/* Function Level Table - Always visible */}
                        <div className="card p-5 mb-6">
                            <div className="flex items-center justify-between">
                                <div className="section-title" style={{ marginBottom: 0 }}>
                                    <span>📊</span> Function Level Automation Details
                                </div>
                                <div className="flex gap-2">
                                    <button className="btn btn-success text-xs" style={{ padding: '4px 10px' }} disabled={!data || !(data.functionData || []).length} onClick={() => {
                                        let csv = 'Function,Total,Automated,Regression,Automated Regression,RVT,Automated RVT,Smoke,Automated Smoke,Automation%,RP Legacy%,RP Legacy Launches,RP Modern%,RP Modern Launches\n';
                                        (data.functionData || []).forEach(fn => {
                                            const autoP = fn.total > 0 ? Math.round((fn.automated / fn.total) * 100) : 0;
                                            const fnLower = (fn.name || '').toLowerCase();
                                            const rpLegacy = (data?.stability?.legacyByFunction || []).find(r => r.func === fnLower || fnLower.includes(r.func) || r.func.includes(fnLower));
                                            const rpModern = (data?.stability?.modernByFunction || []).find(r => r.func === fnLower || fnLower.includes(r.func) || r.func.includes(fnLower));
                                            csv += `"${(fn.name || '').replace(/"/g, '""')}",${fn.total || 0},${fn.automated || 0},${fn.regression || 0},${fn.automatedRegression || 0},${fn.rvt || 0},${fn.automatedRvt || 0},${fn.smoke || 0},${fn.automatedSmoke || 0},${autoP},${rpLegacy ? rpLegacy.passRate : ''},${rpLegacy ? rpLegacy.launches : ''},${rpModern ? rpModern.passRate : ''},${rpModern ? rpModern.launches : ''}\n`;
                                        });
                                        const blob = new Blob([csv], { type: 'text/csv' });
                                        const url = URL.createObjectURL(blob);
                                        const a = document.createElement('a');
                                        a.href = url;
                                        a.download = `Function_Level_Automation_Details_${new Date().toISOString().slice(0, 10)}.csv`;
                                        a.click();
                                        URL.revokeObjectURL(url);
                                    }}>⬇ Download CSV</button>
                                    <button className="btn btn-outline text-xs" style={{ padding: '4px 10px' }} onClick={() => exportSectionPDF('Function Level Automation Details')} disabled={!data}>📄 PDF</button>
                                </div>
                            </div>
                            <div className="table-container">
                                <table>
                                    <thead>
                                        <tr>
                                            <th style={{ background: '#f0f4ff' }}>Function</th>
                                            <th style={{ background: '#f0f4ff' }}>Total</th>
                                            <th style={{ background: '#f0f4ff' }}>Automated</th>
                                            <th style={{ background: '#fef9f0' }}>Regression</th>
                                            <th style={{ background: '#fef9f0' }}>Automated</th>
                                            <th style={{ background: '#fef9f0' }}>RVT</th>
                                            <th style={{ background: '#fef9f0' }}>Automated</th>
                                            <th style={{ background: '#fef9f0' }}>Smoke</th>
                                            <th style={{ background: '#fef9f0' }}>Automated</th>
                                            <th style={{ background: '#f0fff4' }}>Automation%</th>
                                            <th style={{ background: '#f0fff4' }}>RP Legacy%</th>
                                            <th style={{ background: '#f0fff4' }}>RP Modern%</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {data && (data.functionData || []).map((fn, i) => {
                                            const autoP = fn.total > 0 ? Math.round((fn.automated / fn.total) * 100) : 0;
                                            // Match RP function pass rate by comparing lowercase names
                                            const fnLower = fn.name.toLowerCase();
                                            const rpLegacy = (data?.stability?.legacyByFunction || []).find(r => r.func === fnLower || fnLower.includes(r.func) || r.func.includes(fnLower));
                                            const rpModern = (data?.stability?.modernByFunction || []).find(r => r.func === fnLower || fnLower.includes(r.func) || r.func.includes(fnLower));
                                            return (
                                                <tr key={i}>
                                                    <td className="font-medium" style={{ background: '#f8faff' }}>{fn.name}</td>
                                                    <td style={{ background: '#f8faff' }}>
                                                        {hasFunctionCaseList(fn, 'total') ? (
                                                            <a href="#" className="link" title="View test cases" onClick={e => { e.preventDefault(); openFunctionCaseModal(fn, 'total', 'Total'); }}>{fn.total} ↗</a>
                                                        ) : (
                                                            <span>{fn.total}</span>
                                                        )}
                                                    </td>
                                                    <td style={{ background: '#f8faff' }}>
                                                        {hasFunctionCaseList(fn, 'automated') ? (
                                                            <a href="#" className="link" title="View test cases" onClick={e => { e.preventDefault(); openFunctionCaseModal(fn, 'automated', 'Automated'); }}><span className="badge badge-green">{fn.automated} ↗</span></a>
                                                        ) : (
                                                            <span className="badge badge-green">{fn.automated}</span>
                                                        )}
                                                    </td>
                                                    <td style={{ background: '#fffdf8' }}>
                                                        {hasFunctionCaseList(fn, 'regression') ? (
                                                            <a href="#" className="link" title="View test cases" onClick={e => { e.preventDefault(); openFunctionCaseModal(fn, 'regression', 'Regression'); }}>{fn.regression} ↗</a>
                                                        ) : (
                                                            <span>{fn.regression}</span>
                                                        )}
                                                    </td>
                                                    <td style={{ background: '#fffdf8' }}>
                                                        {hasFunctionCaseList(fn, 'automatedRegression') ? (
                                                            <a href="#" className="link" title="View test cases" onClick={e => { e.preventDefault(); openFunctionCaseModal(fn, 'automatedRegression', 'Automated Regression'); }}><span className="badge badge-blue">{fn.automatedRegression} ↗</span></a>
                                                        ) : (
                                                            <span className="badge badge-blue">{fn.automatedRegression}</span>
                                                        )}
                                                    </td>
                                                    <td style={{ background: '#fffdf8' }}>
                                                        {hasFunctionCaseList(fn, 'rvt') ? (
                                                            <a href="#" className="link" title="View test cases" onClick={e => { e.preventDefault(); openFunctionCaseModal(fn, 'rvt', 'RVT'); }}>{fn.rvt} ↗</a>
                                                        ) : (
                                                            <span>{fn.rvt}</span>
                                                        )}
                                                    </td>
                                                    <td style={{ background: '#fffdf8' }}>
                                                        {hasFunctionCaseList(fn, 'automatedRvt') ? (
                                                            <a href="#" className="link" title="View test cases" onClick={e => { e.preventDefault(); openFunctionCaseModal(fn, 'automatedRvt', 'Automated RVT'); }}><span className="badge badge-blue">{fn.automatedRvt} ↗</span></a>
                                                        ) : (
                                                            <span className="badge badge-blue">{fn.automatedRvt}</span>
                                                        )}
                                                    </td>
                                                    <td style={{ background: '#fffdf8' }}>
                                                        {hasFunctionCaseList(fn, 'smoke') ? (
                                                            <a href="#" className="link" title="View test cases" onClick={e => { e.preventDefault(); openFunctionCaseModal(fn, 'smoke', 'Smoke'); }}>{fn.smoke} ↗</a>
                                                        ) : (
                                                            <span>{fn.smoke}</span>
                                                        )}
                                                    </td>
                                                    <td style={{ background: '#fffdf8' }}>
                                                        {hasFunctionCaseList(fn, 'automatedSmoke') ? (
                                                            <a href="#" className="link" title="View test cases" onClick={e => { e.preventDefault(); openFunctionCaseModal(fn, 'automatedSmoke', 'Automated Smoke'); }}><span className="badge badge-blue">{fn.automatedSmoke} ↗</span></a>
                                                        ) : (
                                                            <span className="badge badge-blue">{fn.automatedSmoke}</span>
                                                        )}
                                                    </td>
                                                    <td style={{ background: '#f8fff8' }}>
                                                        <div className="flex items-center gap-2">
                                                            <div className="progress-bar flex-1">
                                                                <div className="progress-fill" style={{ width: `${autoP}%`, background: autoP > 70 ? 'var(--green)' : autoP > 40 ? 'var(--amber)' : 'var(--red)' }}></div>
                                                            </div>
                                                            <span className="text-xs font-medium">{autoP}%</span>
                                                        </div>
                                                    </td>
                                                    <td style={{ background: '#f8fff8' }}>
                                                        {rpLegacy ? (
                                                            <div className="flex items-center gap-1">
                                                                <span className={`text-xs font-semibold ${rpLegacy.passRate > 80 ? 'text-green-600' : rpLegacy.passRate > 60 ? 'text-amber-600' : 'text-red-600'}`}>{rpLegacy.passRate}%</span>
                                                                <span className="text-xs text-slate-400">({rpLegacy.launches})</span>
                                                            </div>
                                                        ) : <span className="text-xs text-slate-400">—</span>}
                                                    </td>
                                                    <td style={{ background: '#f8fff8' }}>
                                                        {rpModern ? (
                                                            <div className="flex items-center gap-1">
                                                                <span className={`text-xs font-semibold ${rpModern.passRate > 80 ? 'text-green-600' : rpModern.passRate > 60 ? 'text-amber-600' : 'text-red-600'}`}>{rpModern.passRate}%</span>
                                                                <span className="text-xs text-slate-400">({rpModern.launches})</span>
                                                            </div>
                                                        ) : <span className="text-xs text-slate-400">—</span>}
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                        {data && (data.functionData || []).length > 0 && (() => {
                                            const fns = data.functionData || [];
                                            const sum = (k) => fns.reduce((acc, fn) => acc + (Number(fn[k]) || 0), 0);
                                            const t = {
                                                total: sum('total'),
                                                automated: sum('automated'),
                                                regression: sum('regression'),
                                                automatedRegression: sum('automatedRegression'),
                                                rvt: sum('rvt'),
                                                automatedRvt: sum('automatedRvt'),
                                                smoke: sum('smoke'),
                                                automatedSmoke: sum('automatedSmoke')
                                            };
                                            const autoP = t.total > 0 ? Math.round((t.automated / t.total) * 100) : 0;
                                            // Overall RP pass% = pass-weighted across all matched functions.
                                            const overallRate = (rows) => {
                                                const tot = (rows || []).reduce((a, r) => a + (Number(r.total) || 0), 0);
                                                const pass = (rows || []).reduce((a, r) => a + (Number(r.passed) || 0), 0);
                                                return tot > 0 ? Math.round((pass / tot) * 100) : null;
                                            };
                                            const legacyRate = overallRate(data?.stability?.legacyByFunction);
                                            const modernRate = overallRate(data?.stability?.modernByFunction);
                                            const cell = { fontWeight: 700, background: '#eef2ff', borderTop: '2px solid #c7d2fe' };
                                            return (
                                                <tr>
                                                    <td style={cell}>TOTAL ({fns.length})</td>
                                                    <td style={cell}>{t.total}</td>
                                                    <td style={cell}>{t.automated}</td>
                                                    <td style={cell}>{t.regression}</td>
                                                    <td style={cell}>{t.automatedRegression}</td>
                                                    <td style={cell}>{t.rvt}</td>
                                                    <td style={cell}>{t.automatedRvt}</td>
                                                    <td style={cell}>{t.smoke}</td>
                                                    <td style={cell}>{t.automatedSmoke}</td>
                                                    <td style={cell}>{autoP}%</td>
                                                    <td style={cell}>{legacyRate == null ? '—' : `${legacyRate}%`}</td>
                                                    <td style={cell}>{modernRate == null ? '—' : `${modernRate}%`}</td>
                                                </tr>
                                            );
                                        })()}
                                        {!data && (
                                            <tr><td colSpan="12" className="text-center text-slate-400 py-8">Click Generate to populate data</td></tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        {/* Stability Charts - Always visible */}
                        <div className="card p-5 mb-6">
                            <div className="flex items-center justify-between mb-4">

{`CREATE TABLE qa_monitor_data (

        // ─── MetricCard ───────────────────────────────────────────────────────
        function MetricCard({ value, label, color, bgColor, onClick, linkText }) {
            return (
                <div className="metric-card" style={{ borderTop: `3px solid ${color}` }} onClick={onClick}>
                    <div className="metric-value" style={{ color }}>{value}</div>
                    <div className="metric-label">{label}</div>
                    {linkText && (
                        <a href="#" className="link text-xs mt-2 inline-block" onClick={e => { e.preventDefault(); onClick?.(); }}>
                            {linkText}
                        </a>
                    )}
                </div>
            );
        }

        // ─── ImprovementCard ──────────────────────────────────────────────────
        function ImprovementCard({ label, value, positive }) {
            // For "positive" metrics (like Automated), increase is good
            // For "negative" metrics (like Mismatches), decrease is good
            const isGood = positive ? value > 0 : value < 0;
            const isBad = positive ? value < 0 : value > 0;
            const arrow = value > 0 ? '↑' : value < 0 ? '↓' : '→';
            const color = isGood ? 'text-green-600' : isBad ? 'text-red-600' : 'text-slate-400';

            return (
                <div className="border border-slate-200 rounded-lg p-4 text-center">
                    <div className={`text-xl font-bold ${color}`}>
                        {arrow} {Math.abs(value)}
                    </div>
                    <div className="text-xs text-slate-500 mt-1">{label}</div>
                </div>
            );
        }

        // ─── StabilityChart ───────────────────────────────────────────────────
        function StabilityChart({ monthlyData, type }) {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current || !monthlyData || !monthlyData.length) return;

                if (chartRef.current) chartRef.current.destroy();

                const ctx = canvasRef.current.getContext('2d');
                const labels = monthlyData.map(m => m.label);
                const passRates = monthlyData.map(m => m.passRate);

                chartRef.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels,
                        datasets: [{
                            label: `Pass Rate % (${type})`,
                            data: passRates,
                            borderColor: type === 'legacy' ? '#f59e0b' : '#6366f1',
                            backgroundColor: type === 'legacy' ? 'rgba(245,158,11,0.1)' : 'rgba(99,102,241,0.1)',
                            fill: true,
                            tension: 0.3,
                            pointRadius: 5,
                            pointHoverRadius: 8
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: { min: 0, max: 100, ticks: { callback: v => v + '%' } }
                        },
                        plugins: {
                            tooltip: {
                                callbacks: {
                                    afterBody: (ctx) => {
                                        const idx = ctx[0]?.dataIndex;
                                        if (idx !== undefined && monthlyData[idx]) {
                                            const m = monthlyData[idx];
                                            return [
                                                `Total Tests: ${m.total}`,
                                                `Passed: ${m.passed}`,
                                                `Failed: ${m.failed}`,
                                                `Skipped: ${m.skipped}`,
                                                `Launches: ${m.launches}`
                                            ];
                                        }
                                        return [];
                                    }
                                }
                            }
                        }
                    }
                });

                return () => { if (chartRef.current) chartRef.current.destroy(); };
            }, [monthlyData, type]);

            if (!monthlyData || !monthlyData.length) {
                return <div className="text-sm text-slate-400 text-center py-8">No {type} regression data available. Run Report Portal section.</div>;
            }

            return (
                <div>
                    <div className="chart-container">
                        <canvas ref={canvasRef}></canvas>
                    </div>
                    <div className="mt-3 table-container" style={{ maxHeight: '200px', overflowY: 'auto' }}>
                        <table>
                            <thead>
                                <tr>
                                    <th>Month</th>
                                    <th>Total Tests</th>
                                    <th>Passed</th>
                                    <th>Failed</th>
                                    <th>Pass Rate</th>
                                    <th>Launches</th>
                                </tr>
                            </thead>
                            <tbody>
                                {monthlyData.map((m, i) => (
                                    <tr key={i}>
                                        <td className="font-medium">{m.label}</td>
                                        <td>{m.total}</td>
                                        <td><span className="badge badge-green">{m.passed}</span></td>
                                        <td><span className="badge badge-red">{m.failed}</span></td>
                                        <td>
                                            <div className="flex items-center gap-2">
                                                <div className="progress-bar flex-1">
                                                    <div className="progress-fill" style={{ width: `${m.passRate}%`, background: m.passRate > 80 ? 'var(--green)' : m.passRate > 60 ? 'var(--amber)' : 'var(--red)' }}></div>
                                                </div>
                                                <span className="text-xs font-semibold">{m.passRate}%</span>
                                            </div>
                                        </td>
                                        <td className="text-xs text-slate-500">{m.launches}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        // ─── FunctionStabilityTable ──────────────────────────────────────────
        function FunctionStabilityTable({ data, type }) {
            if (!data || data.length === 0) {
                return <div className="text-sm text-slate-400 text-center py-4">No function-level data available.</div>;
            }
            const color = type === 'legacy' ? '#f59e0b' : '#6366f1';
            return (
                <div className="table-container" style={{ maxHeight: '300px', overflowY: 'auto' }}>
                    <table>
                        <thead>
                            <tr>
                                <th>Function</th>
                                <th>Launches</th>
                                <th>Total Tests</th>
                                <th>Passed</th>
                                <th>Failed</th>
                                <th>Pass Rate</th>
                            </tr>
                        </thead>
                        <tbody>
                            {data.map((row, i) => (
                                <tr key={i}>
                                    <td className="font-medium text-sm capitalize">{row.func}</td>
                                    <td className="text-xs">{row.launches}</td>
                                    <td className="text-xs">{row.total}</td>
                                    <td><span className="badge badge-green">{row.passed}</span></td>
                                    <td><span className="badge badge-red">{row.failed}</span></td>
                                    <td>
                                        <div className="flex items-center gap-2">
                                            <div className="progress-bar flex-1">
                                                <div className="progress-fill" style={{ width: `${row.passRate}%`, background: row.passRate > 80 ? 'var(--green)' : row.passRate > 60 ? 'var(--amber)' : 'var(--red)' }}></div>
                                            </div>
                                            <span className="text-xs font-semibold">{row.passRate}%</span>
                                        </div>
                                    </td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );
        }

        // ─── AutomationTimelineChart ─────────────────────────────────────────
        function AutomationTimelineChart({ timeline }) {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current || !timeline || !timeline.length) return;
                if (chartRef.current) chartRef.current.destroy();

                const ctx = canvasRef.current.getContext('2d');
                const labels = timeline.map(t => t.label);
                const newAutomated = timeline.map(t => t.newAutomated);
                const cumulative = timeline.map(t => t.cumulativeTotal);

                chartRef.current = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels,
                        datasets: [
                            {
                                label: 'New Tests Automated',
                                data: newAutomated,
                                backgroundColor: 'rgba(99, 102, 241, 0.7)',
                                borderColor: '#6366f1',
                                borderWidth: 1,
                                borderRadius: 4,
                                order: 2
                            },
                            {
                                label: 'Cumulative Total',
                                data: cumulative,
                                type: 'line',
                                borderColor: '#10b981',
                                backgroundColor: 'rgba(16, 185, 129, 0.1)',
                                fill: true,
                                tension: 0.3,
                                pointRadius: 4,
                                pointHoverRadius: 7,
                                yAxisID: 'y1',
                                order: 1
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        scales: {
                            y: {
                                beginAtZero: true,
                                title: { display: true, text: 'New Tests / Month' }
                            },
                            y1: {
                                position: 'right',
                                beginAtZero: true,
                                title: { display: true, text: 'Cumulative Total' },
                                grid: { drawOnChartArea: false }
                            }
                        },
                        plugins: {
                            tooltip: {
                                callbacks: {
                                    afterBody: (ctx) => {
                                        const idx = ctx[0]?.dataIndex;
                                        if (idx !== undefined && timeline[idx]) {
                                            return [`Month: ${timeline[idx].month}`];
                                        }
                                        return [];
                                    }
                                }
                            }
                        }
                    }
                });

                return () => { if (chartRef.current) chartRef.current.destroy(); };
            }, [timeline]);

            if (!timeline || !timeline.length) {
                return <div className="text-sm text-slate-400 text-center py-8">No automation timeline data available. Run generation multiple times to build history.</div>;
            }

            return (
                <div className="chart-container">
                    <canvas ref={canvasRef}></canvas>
                </div>
            );
        }

        // ─── BugsFoundByMonthChart ────────────────────────────────────────────
        function BugsFoundByMonthChart({ bugsByMonth }) {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current || !bugsByMonth || !bugsByMonth.length) return;
                if (chartRef.current) chartRef.current.destroy();

                const ctx = canvasRef.current.getContext('2d');
                const labels = bugsByMonth.map(b => {
                    const d = new Date(b.month + '-01');
                    return d.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
                });
                const counts = bugsByMonth.map(b => b.count);

                chartRef.current = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels,
                        datasets: [{
                            label: 'Bugs Found by Automation',
                            data: counts,
                            backgroundColor: 'rgba(239, 68, 68, 0.7)',
                            borderColor: '#ef4444',
                            borderWidth: 1,
                            borderRadius: 4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: { stepSize: 1 },
                                title: { display: true, text: 'Bug Count' }
                            }
                        },
                        plugins: {
                            tooltip: {
                                callbacks: {
                                    afterBody: (ctx) => {
                                        const idx = ctx[0]?.dataIndex;
                                        if (idx !== undefined && bugsByMonth[idx]) {
                                            const bugs = bugsByMonth[idx].bugs.slice(0, 5);
                                            const lines = bugs.map(b => `• ${b.itemName?.slice(0, 40) || 'Test'} ${b.bugId ? '(#' + b.bugId + ')' : ''}`);
                                            if (bugsByMonth[idx].bugs.length > 5) lines.push(`  +${bugsByMonth[idx].bugs.length - 5} more`);
                                            return lines;
                                        }
                                        return [];
                                    }
                                }
                            }
                        }
                    }
                });

                return () => { if (chartRef.current) chartRef.current.destroy(); };
            }, [bugsByMonth]);

            if (!bugsByMonth || !bugsByMonth.length) {
                return <div className="text-sm text-slate-400 text-center py-8">No bug data from automation available. Ensure RP token is configured and launches have linked defects.</div>;
            }

            return (
                <div className="chart-container">
                    <canvas ref={canvasRef}></canvas>
                </div>
            );
        }

        // ─── DetailModal ──────────────────────────────────────────────────────
        function DetailModal({ type, data, onClose, customTitle }) {
            const titles = {
                mismatches: 'Mismatches',
                requires_update: 'Tests with requires_update',
                open_bugs: 'Tests with open_bug',
                runSequential: 'Tests with runSequential',
                bugs_by_automation: 'Bugs Found by Automation',
                timeline_ids: customTitle || 'Automated Test Cases',
                function_case_list: customTitle || 'Function Test Cases'
            };

            function downloadCSV() {
                let csv = '';
                if (type === 'timeline_ids') {
                    csv = 'Work Item ID,Automated Date,Link\n';
                    data.forEach(item => {
                        csv += `${item.id},${item.date ? new Date(item.date).toLocaleDateString() : ''},https://dev.azure.com/tr-legal/HighQ%20Tech/_workitems/edit/${item.id}\n`;
                    });
                } else if (type === 'mismatches') {
                    csv = 'ID,Title,Type,Detail,File\n';
                    data.forEach(item => {
                        csv += `${item.id},"${(item.title || '').replace(/"/g, '""')}",${item.type},"${(item.detail || '').replace(/"/g, '""')}","${item.file || ''}"\n`;
                    });
                } else if (type === 'bugs_by_automation') {
                    csv = 'Month,Test Name,Launch,Bug ID,Issue Type,Comment\n';
                    data.forEach(bug => {
                        csv += `${bug.month},"${(bug.itemName || '').replace(/"/g, '""')}","${(bug.launchName || '').replace(/"/g, '""')}",${bug.bugId || ''},${bug.issueType},"${(bug.comment || '').replace(/"/g, '""')}"\n`;
                    });
                } else if (type === 'function_case_list') {
                    csv = 'Work Item ID,Title,State,Suite Type,Automation Status,Function,Sub Function,Link\n';
                    data.forEach(item => {
                        csv += `${item.id || ''},"${(item.title || '').replace(/"/g, '""')}","${(item.state || '').replace(/"/g, '""')}","${(item.suiteType || '').replace(/"/g, '""')}","${(item.autoStatus || '').replace(/"/g, '""')}","${(item.function || '').replace(/"/g, '""')}","${(item.subFunction || '').replace(/"/g, '""')}",https://dev.azure.com/tr-legal/HighQ%20Tech/_workitems/edit/${item.id}\n`;
                    });
                } else {
                    csv = 'File,Folder,IDs,Author,Tags\n';
                    data.forEach(item => {
                        csv += `"${item.fileName || ''}","${item.folder || ''}","${(item.ids || []).join('; ')}","${item.author || ''}","${(item.tags || []).join('; ')}"\n`;
                    });
                }
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${(titles[type] || type).replace(/\s+/g, '_')}_${new Date().toISOString().slice(0, 10)}.csv`;
                a.click();
                URL.revokeObjectURL(url);
            }

            return (
                <div>
                    <div className="flex justify-between items-center mb-4">
                        <h3 className="text-lg font-bold">{titles[type] || customTitle || type} ({data.length})</h3>
                        <div className="flex gap-2">
                            <button className="btn btn-success text-xs" onClick={downloadCSV}>⬇ Download CSV</button>
                            <button className="btn btn-outline text-xs" onClick={onClose}>✕ Close</button>
                        </div>
                    </div>
                    <div className="table-container" style={{ maxHeight: '60vh', overflowY: 'auto' }}>
                        {type === 'timeline_ids' ? (
                            <table>
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Work Item ID</th>
                                        <th>Automated Date</th>
                                        <th>Link</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {data.map((item, i) => (
                                        <tr key={i}>
                                            <td className="text-xs text-slate-400">{i + 1}</td>
                                            <td className="font-medium">{item.id}</td>
                                            <td className="text-xs">{item.date ? new Date(item.date).toLocaleDateString() : '—'}</td>
                                            <td>
                                                <a href={`https://dev.azure.com/tr-legal/HighQ%20Tech/_workitems/edit/${item.id}`}
                                                   target="_blank" className="link text-xs">Open in ADO ↗</a>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        ) : type === 'mismatches' ? (
                            <table>
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Title</th>
                                        <th>Type</th>
                                        <th>Detail</th>
                                        <th>File</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {data.map((item, i) => (
                                        <tr key={i}>
                                            <td>
                                                <a href={`https://dev.azure.com/tr-legal/HighQ%20Tech/_workitems/edit/${item.id}`}
                                                   target="_blank" className="link">{item.id}</a>
                                            </td>
                                            <td className="max-w-xs truncate">{item.title}</td>
                                            <td><span className={`badge ${item.type.includes('CLOSED') ? 'badge-red' : item.type.includes('AUTOMATED') || item.type.includes('REQUIRES_AUTOMATION') ? 'badge-amber' : item.type.includes('TBD') || item.type.includes('MANUAL') ? 'badge-purple' : 'badge-blue'}`}>{item.type.replace(/_/g, ' ')}</span></td>
                                            <td className="text-xs text-slate-500 max-w-xs truncate">{item.detail}</td>
                                            <td className="text-xs truncate max-w-[120px]">{item.file}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        ) : type === 'bugs_by_automation' ? (
                            <table>
                                <thead>
                                    <tr>
                                        <th>Month</th>
                                        <th>Test Name</th>
                                        <th>Launch</th>
                                        <th>Bug ID</th>
                                        <th>Issue Type</th>
                                        <th>Comment</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {data.map((bug, i) => (
                                        <tr key={i}>
                                            <td className="text-xs whitespace-nowrap">{bug.month}</td>
                                            <td className="text-xs max-w-[200px] truncate">{bug.itemName}</td>
                                            <td className="text-xs max-w-[150px] truncate">{bug.launchName}</td>
                                            <td>
                                                {bug.bugId ? (
                                                    <a href={`https://dev.azure.com/tr-legal/HighQ%20Tech/_workitems/edit/${bug.bugId}`}
                                                       target="_blank" className="link text-xs">#{bug.bugId}</a>
                                                ) : (
                                                    <span className="text-xs text-slate-400">—</span>
                                                )}
                                            </td>
                                            <td><span className="badge badge-red">{bug.issueType}</span></td>
                                            <td className="text-xs max-w-[200px] truncate text-slate-500">{bug.comment}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        ) : type === 'function_case_list' ? (
                            <table>
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Work Item ID</th>
                                        <th>Title</th>
                                        <th>State</th>
                                        <th>Suite Type</th>
                                        <th>Automation Status</th>
                                        <th>Function</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {data.map((item, i) => (
                                        <tr key={i}>
                                            <td className="text-xs text-slate-400">{i + 1}</td>
                                            <td>
                                                <a href={`https://dev.azure.com/tr-legal/HighQ%20Tech/_workitems/edit/${item.id}`}
                                                   target="_blank" className="link text-xs">#{item.id}</a>
                                            </td>
                                            <td className="text-xs max-w-[260px] truncate" title={item.title || ''}>{item.title || '—'}</td>
                                            <td className="text-xs">{item.state || '—'}</td>
                                            <td className="text-xs">{item.suiteType || '—'}</td>
                                            <td className="text-xs">{item.autoStatus || '—'}</td>
                                            <td className="text-xs">{item.function || '—'}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        ) : (
                            <table>
                                <thead>
                                    <tr>
                                        <th>File</th>
                                        <th>Folder</th>
                                        <th>IDs</th>
                                        <th>Author</th>
                                        <th>Tags</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {data.map((item, i) => (
                                        <tr key={i}>
                                            <td>
                                                <a href={`https://github.com/${GH_REPO}/blob/${GH_BRANCH}/${item.file}`}
                                                   target="_blank" className="link text-xs">{item.fileName}</a>
                                            </td>
                                            <td className="text-xs text-slate-500 max-w-[150px] truncate">{item.folder}</td>
                                            <td className="text-xs">{(item.ids || []).slice(0, 5).join(', ')}{item.ids?.length > 5 ? '...' : ''}</td>
                                            <td className="text-xs">{item.author}</td>
                                            <td className="text-xs">{(item.tags || []).join(', ')}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        )}
                    </div>
                </div>
            );
        }

        // ─── Mount ────────────────────────────────────────────────────────────
        ReactDOM.createRoot(document.getElementById('root')).render(<QAMonitorApp />);
    </script>
    <script>
        (function bootstrapQAMonitor() {
            try {
                const sourceEl = document.getElementById('qa-app-source');
                if (!sourceEl || !window.Babel) return;
                const transformed = Babel.transform(sourceEl.textContent || '', {
                    presets: ['env'],
                    plugins: [[Babel.availablePlugins['transform-react-jsx'], { runtime: 'classic' }]]
                }).code;
                const runtimeScript = document.createElement('script');
                runtimeScript.text = transformed;
                document.body.appendChild(runtimeScript);
            } catch (err) {
                console.error('QA Monitor bootstrap failed:', err);
                const fallback = document.createElement('div');
                fallback.style.cssText = 'padding:16px;color:#b91c1c;font-family:Segoe UI,sans-serif;font-size:14px;';
                fallback.textContent = 'Failed to load QA Automation Monitor. Check browser console for details.';
                document.body.appendChild(fallback);
            }
        })();
    </script>
</body>

</html>
